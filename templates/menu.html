{% extends 'base.html' %}

{% block title %}Gemanti - Menu{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/css/menu.css">
{% endblock %}

{% block content %}
  <section class="game-menu-page direct-view" role="main">

    <div class="menu-panel">
      <div class="game-menu-items">

        <div class="game-menu-item">
          <a href="/profil">
            <img src="/static/img/profil.png" alt="Profil">
          </a>
        </div>

        <div class="game-menu-item">
          <a href="/demo">
            <img src="/static/img/demo.png" alt="Permainan">
          </a>
        </div>

        <div class="game-menu-item">
          <a href="/permainan">
            <img src="/static/img/permainan.png" alt="Demo">
          </a>
        </div>

      </div>
      <style>
  .bottom-right {
    position: absolute;
    right: 0.5rem;
    bottom: 0.5rem;
    width: clamp(56px, 10vw, 72px);
    aspect-ratio: 1;
    border: 1px solid rgba(0, 0, 0, 0.12);
    background: rgba(255, 255, 255, 0.92);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 10px 18px rgba(0, 0, 0, 0.16);
  }

  .bottom-right img {
    width: 58%;
    height: 58%;
    object-fit: contain;
  }
</style>

<!-- Tombol Fullscreen (Kanan Bawah) -->
<button id="fullscreenButton" class="bottom-right" type="button" aria-label="Buka layar penuh">
  <img src="/static/img/fs.png" alt="Layar penuh">
</button>

<style>
  .icon-button {
    position: absolute;
    top: 0.5rem;
    width: clamp(48px, 10vw, 60px);
    aspect-ratio: 1;
    border: none;
    background: transparent;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .top-left {
    left: 0.5rem;
  }

  .top-right {
    right: 0.5rem;
  }

  .icon-button img {
    width: 70%;
    height: 70%;
    object-fit: contain;
  }
</style>

<!-- Speaker (Kiri Atas) -->
<button class="icon-button top-left" id="soundButton" type="button" aria-label="Matikan suara">
  <img id="soundIcon" src="/static/img/speaker_aktif.png" alt="">
</button>

<!-- Home (Kanan Atas) -->
<button class="icon-button top-right" id="profileButton" type="button" aria-label="Profil">
  <img src="/static/img/home.png" alt="">
</button>
    </div>
  
  </section>
   
{% endblock %}
