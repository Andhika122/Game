{% extends 'base.html' %}

{% block title %}Gemanti - Permainan{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/css/demo.css">
<link rel="stylesheet" href="/static/css/permainan.css">
{% endblock %}

{% block content %}
  <section class="game-menu-page direct-view permainan-top" role="main">

   
    <div class="menu-panel">
      <div class="permainan-page-wrapper">
        <section class="permainan-select-page" aria-label="Pilih permainan Permainan">
          <div class="permainan-select-intro">
            <p class="permainan-select-overline">Permainan</p>
          </div>

          <div class="permainan-select-card">
            <article class="permainan-select-item">
              <div class="item-deco item-deco--plus"></div>
              <h2>Simbol Bilangan</h2>
              <img src="/static/img/0.png" alt="Ilustrasi simbol bilangan" class="permainan-select-image">
              <a class="btn" href="/permainan/simbol/bilangan">Main</a>
            </article>

            <article class="permainan-select-item">
              <div class="item-deco item-deco--plus"></div>
              <h2>Penjumlahan</h2>
              <p>+</p>
              <a class="btn" href="/permainan/penjumlahan">Main</a>
            </article>

            <article class="permainan-select-item">
              <div class="item-deco item-deco--minus"></div>
              <h2>Pengurangan</h2>
              <p>-</p>
              <a class="btn" href="/permainan/pengurangan">Main</a>
            </article>
          </div>
        </section>
      </div>
    </div>

  </section>
{% endblock %}
