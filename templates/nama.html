{% extends 'base.html' %}

{% block title %}Gemanti - Masukkan Nama{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/css/nama.css">
{% endblock %}

{% block body_class %}page-home page-nama{% endblock %}

{% block content %}

  <!-- Background & top icons -->
  <img class="background-image" src="/static/img/latar_belakang.png" alt="" aria-hidden="true">
  <img class="front-ground" src="/static/img/tanah.png" alt="" aria-hidden="true">
  <img class="leaf leaf-left" src="/static/img/rumput_kiri.png" alt="" aria-hidden="true">
  <img class="leaf leaf-right" src="/static/img/rumput_kanan.png" alt="" aria-hidden="true">

  <header class="brand">
    <img class="brand-logo" src="/static/img/logo.png" alt="Gemanti - Game Tembang Kurang Interaktif">
  </header>

  <section class="nama-screen">
    <div class="nama-card">
      <h1>Halo, Siapa Namamu?</h1>
      <p>Masukkan nama untuk mulai bermain.</p>
      <form id="playerNameForm" class="nama-form" action="#">
        <input id="playerNameInput" name="playerName" type="text" placeholder="Ketik nama kamu" autocomplete="name" required>
        <button id="playerNameSubmit" type="submit" class="btn btn--primary">Lanjut</button>
      </form>
    </div>
  </section>

  <div id="introVideoOverlay" class="intro-video-overlay" aria-hidden="false">
    <div class="intro-video-panel">
      <video id="introVideo" playsinline preload="auto">
        <source src="/static/video/vidio_logo.mp4" type="video/mp4">
        Video tidak didukung oleh browser ini.
      </video>
      <button id="introVideoStartButton" class="intro-video-start-button" type="button">Klik tombol untuk mulai video</button>
    </div>
  </div>

{% endblock %}
